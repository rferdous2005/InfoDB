spring.application.name=info

logging.file.name=logs/app.log
logging.level.org.springframework=WARN
logging.level.root=WARN
# spring.profiles.active=prod
# app based config values
app.self.baseUrl=http://localhost:8080/
server.servlet.session.timeout=30m

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Database Configuration Overwrite
spring.datasource.url=jdbc:mysql://localhost:3306/InfoDB?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Nopass@!23
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration Overwrite
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
